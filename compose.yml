name: alfa-smart-credit

x-backend: &backend
  image: alfa-smart-credit-backend:local
  build: ./backend
  environment: &environment
    DATABASE_URL: postgresql+psycopg://alfa:${POSTGRES_PASSWORD:?Run python scripts/setup_env.py}@db:5432/alfa
    APP_SECRET_KEY: ${APP_SECRET_KEY:?Run python scripts/setup_env.py}
    UPLOAD_DIR: /app/storage
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    VERIFICATION_PROVIDER: records
    PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    SMTP_HOST: ${SMTP_HOST:-mailpit}
    SMTP_PORT: ${SMTP_PORT:-1025}
    MAIL_FROM: ${MAIL_FROM:-noreply@finmarshrut.test}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}

services:
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAIL_PORT:-8025}:8025"
    volumes:
      - maildata:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.0
    environment:
      POSTGRES_DB: alfa
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/setup_env.py}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U alfa -d alfa]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  seed:
    <<: *backend
    command: [python, -m, app.bootstrap]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - documents:/app/storage
    depends_on:
      mailpit:
        condition: service_started
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, scripts/readiness.py]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  tests:
    <<: *backend
    profiles: [test]
    environment:
      <<: *environment
      DATABASE_TEST_URL: postgresql+psycopg://alfa:${POSTGRES_PASSWORD:?Run python scripts/setup_env.py}@db:5432/alfa
    command: [python, -m, pytest, -q, -p, "no:cacheprovider", --basetemp, /tmp/alfa-tests]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  documents:
  maildata:
