[project]
name = "alfa-smart-credit-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
description = "Backend for Alfa Hack 2026 smart credit MVP"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "SQLAlchemy==2.0.50",
  "alembic==1.19.1",
  "alembic==1.19.1",
  "pydantic==2.13.5",
  "PyJWT==2.13.0",
  "python-multipart==0.0.29",
  "psycopg[binary]==3.2.12",
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
